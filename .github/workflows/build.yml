name: Build Android 12 GKI Kernel with AnyKernel3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential bc bison flex \
            libssl-dev libelf-dev \
            python3 python3-pip \
            zip unzip cpio rsync lz4

      - name: Download AOSP GCC and Clang
        run: |
          mkdir -p ~/toolchains
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r450784d.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C ~/toolchains/
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 ~/toolchains/gcc-64

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=~/toolchains/clang-r450784d
          export GCC_PATH=~/toolchains/gcc-64
          export CROSS_COMPILE=$GCC_PATH/bin/aarch64-linux-android-
          export PATH=$CLANG_PATH/bin:$PATH
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export HOSTCC=gcc

          make O=out gki_defconfig
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

      - name: Prepare AnyKernel3
        run: |
          KERNEL_IMAGE=out/arch/arm64/boot/Image.gz
          cp $KERNEL_IMAGE AnyKernel3/zImage

          # 如果有 dtbo.img 你可以加上这一行
          # cp out/arch/arm64/boot/dts/*.dtbo AnyKernel3/

      - name: Create flashable zip
        run: |
          cd AnyKernel3
          zip -r9 ../flashable-kernel.zip ./*

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: flashable-kernel
          path: flashable-kernel.zip
